services:
  - type: web
    name: insider-threat-dashboard
    runtime: python
    rootDir: proj
    plan: free
    buildCommand: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
      cd frontend
      npm install
      npm run build
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 10000
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "3306"
      - key: MYSQL_DATABASE
        value: insider_threat
      - key: MYSQL_USER
        value: root
      - key: MYSQL_PASSWORD
        sync: false
